<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>场景图片编辑 · 声音成片工作台</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#101522;color:#e8eeff}
    *{box-sizing:border-box}body{margin:0}a{color:#a9b9ff}button,select,textarea{font:inherit}button{cursor:pointer}
    .shell{max-width:1350px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.top h1{font-size:27px;margin:0 0 7px}.top p,.hint{font-size:12px;color:#99a7c5;line-height:1.6}.top p{margin:0}.toolbar{display:flex;gap:9px;align-items:center}.ghost,.primary,.danger{border:1px solid #526186;border-radius:9px;background:#283553;color:#e8eeff;padding:9px 13px;text-decoration:none;white-space:nowrap}.primary{background:#a9b9ff;color:#14192b;border-color:#a9b9ff;font-weight:700}.danger{background:#56313d;border-color:#895667}.ghost:hover{background:#34436a}.primary:hover{background:#c4ceff}.banner{border:1px solid #3d4c6e;background:#1a2439;border-radius:11px;padding:13px;margin:12px 0}.banner.error{border-color:#955665;background:#462c35;color:#ffe0e5}.banner.success{border-color:#4a826e;background:#1d4036;color:#bbf3d9}#notice.banner{position:fixed;top:16px;right:18px;z-index:50;max-width:min(440px,calc(100vw - 36px));box-shadow:0 12px 35px #0008}.hidden{display:none!important}
    .scene{border:1px solid #384560;background:#1a2132;border-radius:15px;margin:17px 0;padding:18px}.scene-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.scene-head h2{font-size:18px;margin:0 0 5px}.scene-head p{font-size:12px;color:#aebbd4;line-height:1.5;margin:0;max-width:780px}.badge{font-size:11px;background:#344264;border-radius:99px;padding:6px 10px;color:#c9d6fb}.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:18px}.layer{border:1px solid #39455e;background:#141b2a;border-radius:11px;padding:13px;min-width:0}.layer h3{font-size:14px;margin:0 0 9px}.image{width:100%;height:230px;object-fit:contain;background:repeating-conic-gradient(#273044 0 25%,#1e2637 0 50%) 50%/22px 22px;border-radius:8px;border:1px solid #36415c}.empty-image{height:230px;display:grid;place-items:center;color:#8492b2;background:#111725;border-radius:8px}.layer label{display:block;color:#b7c3dd;font-size:11px;margin:10px 0 5px}.cutout-command{white-space:pre-wrap;overflow-wrap:anywhere;background:#101725;border:1px solid #495575;border-radius:8px;padding:10px;font:11px/1.5 ui-monospace,SFMono-Regular,monospace;color:#b8c7e8}.layer textarea{width:100%;min-height:115px;resize:vertical;border:1px solid #495575;background:#101725;color:#edf2ff;border-radius:8px;padding:10px;font:11px/1.5 ui-monospace,SFMono-Regular,monospace}.effect-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.effect-grid select,.scene-head select{width:100%;padding:8px;border:1px solid #495575;border-radius:8px;background:#111a2b;color:#e4ebfb;font-size:12px}.layer-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}.layer-actions button{font-size:12px}.upload{position:relative;overflow:hidden}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.task{border:1px solid #3d4b6a;background:#18243b;border-radius:10px;padding:13px;margin:10px 0}.task-head{display:flex;justify-content:space-between;gap:12px;font-size:12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.compare figure{margin:0}.compare img{width:100%;height:210px;object-fit:contain;background:repeating-conic-gradient(#273044 0 25%,#1e2637 0 50%) 50%/22px 22px;border:1px solid #3d4b6a;border-radius:8px}.compare figcaption{color:#9faccc;font-size:11px;margin-bottom:5px}.task-actions{display:flex;gap:8px}.task-actions button{font-size:12px}.task small{color:#aab6d0}.status{margin:18px 0}.group-head{margin-top:27px;font-size:16px}
    @media(max-width:680px){.top,.scene-head{display:block}.toolbar{margin-top:14px}.shell{padding:20px 12px}.scene{padding:13px}.layers{grid-template-columns:1fr}.compare img{height:145px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div><h1>场景图片编辑</h1><p>查看各场景原图、图层、动效与完整 Draw Things 命令。重新生成会先保存候选图，确认后才替换原图。</p></div><div class="toolbar"><select id="scene-picker" class="ghost" aria-label="跳转到场景"><option value="">跳转场景…</option></select><a class="ghost" href="/">返回主页面</a><button class="ghost" id="refresh">刷新</button></div></header>
  <div id="notice" class="banner hidden" role="status"></div>
  <div id="sync" class="banner hidden"></div>
  <div id="scenes"></div>
  <h2 class="group-head">后台任务</h2><p class="hint">生图和重建按顺序执行。切换页面或刷新后仍可回来查看结果。</p><div id="tasks" class="status"></div>
</main>
<script>
  const jobId={{ job_id|tojson }}, apiBase=`/api/jobs/${encodeURIComponent(jobId)}/editor`;
  const $=id=>document.getElementById(id);
  const labels={image:'场景原图',background:'空背景',foreground:'透明人物'};
  const choices={fade:[['none','无'],['in','淡入'],['out','淡出'],['in_out','淡入并淡出']],horizontal:[['none','无'],['left','向左'],['right','向右']],vertical:[['none','无'],['up','向上'],['down','向下']],zoom:[['none','无'],['in','推近'],['out','拉远']]};
  let inventory=null,renderedScenes=false;
  function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
  function notice(message,error=false){const box=$('notice');box.textContent=message;box.className=`banner ${error?'error':'success'}`;if(!message)box.classList.add('hidden')}
  async function api(url,options={}){const response=await fetch(url,options);const contentType=response.headers.get('content-type')||'';if(!contentType.includes('application/json'))throw new Error(`服务器返回非 JSON 响应（HTTP ${response.status}）`);let data;try{data=await response.json()}catch{throw new Error('服务器响应无法解析')}if(!response.ok)throw new Error(data.error||`请求失败：${response.status}`);return data}
  function request(method,url,data){return api(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}
  function effectControls(values){const grid=node('div','effect-grid'),selects={};for(const [group,items] of Object.entries(choices)){const wrap=node('div'),label=node('label','',({fade:'淡入淡出',horizontal:'水平移动',vertical:'垂直移动',zoom:'推近拉远'})[group]),select=node('select');for(const [value,text] of items)select.add(new Option(text,value));select.value=values?.[group]||'none';wrap.append(label,select);grid.append(wrap);selects[group]=select}return {grid,read:()=>Object.fromEntries(Object.entries(selects).map(([key,value])=>[key,value.value]))}}
  function setX2Command(command,enabled){
    const config=' --config-json \'{"upscaler":"realesrgan_x2plus_f16.ckpt","upscalerScaleFactor":2}\'';
    let value=command.value.replace(config,'');
    for(const flag of ['width','height']){const pattern=new RegExp(`--${flag} (\\d+)`),match=value.match(pattern);if(match){const size=Number(match[1]),changed=enabled?Math.max(64,Math.ceil(size/128)*64):size*2;value=value.replace(pattern,`--${flag} ${changed}`)}}
    command.value=enabled?value+config:value;
  }
  function renderScenes(data){const host=$('scenes');host.replaceChildren();const picker=$('scene-picker');picker.replaceChildren(new Option('跳转场景…',''));for(const scene of data.scenes){picker.add(new Option(`场景 ${scene.index} · ${scene.start.toFixed(1)} 秒`,String(scene.index)));const card=node('section','scene'),head=node('div','scene-head'),title=node('div');card.id=`scene-card-${scene.index}`;title.append(node('h2','',`场景 ${scene.index} · ${scene.start.toFixed(1)}–${scene.end.toFixed(1)} 秒`),node('p','',scene.prompt));const headActions=node('div','toolbar'),fold=node('button','ghost',scene.index===1?'收起图片':'展开图片');headActions.append(node('span','badge',scene.motion),fold);head.append(title,headActions);card.append(head);
      const sceneSettings=node('div','layer-actions'),preset=node('select'),presence=node('label','',"主角在画面中"),present=node('input');
      for(const [value,label] of [['static','静止'],['push_in','推近'],['pull_out','拉远'],['pan_left','向左'],['pan_right','向右'],['parallax','分层视差']])preset.add(new Option(label,value));preset.value=scene.motion;
      present.type='checkbox';present.checked=!!scene.character_present;presence.prepend(present);const saveScene=node('button','ghost','保存场景设置');saveScene.onclick=async()=>{try{await request('PATCH',`${apiBase}/motion/${scene.index}/image`,{effects:scene.motion_effects||{},motion:preset.value,character_present:present.checked});notice('场景设置已保存；可继续编辑图片，输出会在后台重建');await refresh(true)}catch(e){notice(e.message,true)}};
      sceneSettings.append(preset,presence,saveScene);card.append(sceneSettings);if(scene.motion_reason)card.append(node('p','hint',`自动运镜理由：${scene.motion_reason}`));
      const layerGrid=node('div','layers');for(const layer of scene.layers){const pane=node('article','layer');pane.append(node('h3','',layer.name==='image'&&scene.motion==='parallax'?'人物源图（用于抠图）':labels[layer.name]||layer.name));if(layer.url){const img=node('img','image');img.src=`${layer.url}?t=${Date.now()}`;img.alt=`场景 ${scene.index} ${labels[layer.name]}`;img.loading='lazy';pane.append(img)}else pane.append(node('div','empty-image','此图层尚无图片，可上传或生图'));
        if(layer.derived)pane.append(node('p','hint','人物图是从场景原图抠出的；重新生成会先生成新人物源图，再抠出透明人物。上传时请使用透明 PNG。'));
        const sourceOnly=scene.motion==='parallax'&&layer.name==='image';if(sourceOnly)pane.append(node('p','hint','人物源图不直接进入视频；请在空背景和透明人物图层分别设置动效。'));const controls=effectControls(layer.motion_effects);if(!sourceOnly)pane.append(controls.grid);const save=node('button','ghost','保存此图层动效');save.onclick=async()=>{try{await request('PATCH',`${apiBase}/motion/${scene.index}/${layer.name}`,{effects:controls.read()});notice('动效已保存，正在后台重建输出');await refresh(true)}catch(e){notice(e.message,true)}};if(!sourceOnly)pane.append(save);
        pane.append(node('label','','Draw Things 完整命令（可编辑提示词、模型、尺寸、步数、seed）'));const command=node('textarea');command.value=layer.command;command.spellcheck=false;pane.append(command);const upscaleLabel=node('label','','使用 Real-ESRGAN X2+ 放大（基础尺寸约减半）'),upscale=node('input');upscale.type='checkbox';upscale.checked=!!layer.upscale_x2;upscale.onchange=()=>setX2Command(command,upscale.checked);upscaleLabel.prepend(upscale);pane.append(upscaleLabel);if(layer.cutout_command){pane.append(node('label','','自动抠图命令（只读）'),node('pre','cutout-command',layer.cutout_command))}const actions=node('div','layer-actions'),generate=node('button','primary','重新生成候选图');generate.onclick=async()=>{generate.disabled=true;try{await request('POST',`${apiBase}/candidates/generate`,{scene:scene.index,layer:layer.name,command:command.value});notice('已加入后台生图队列');await refresh(false)}catch(e){notice(e.message,true)}finally{generate.disabled=false}};actions.append(generate);
        const upload=node('label','ghost upload','上传图片替换'),file=node('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.onchange=async()=>{if(!file.files?.length)return;const form=new FormData();form.append('scene',scene.index);form.append('layer',layer.name);form.append('file',file.files[0]);try{await api(`${apiBase}/candidates/upload`,{method:'POST',body:form});notice('图片已上传，正在后台校验');await refresh(false)}catch(e){notice(e.message,true)}file.value=''};upload.append(file);actions.append(upload);pane.append(actions);layerGrid.append(pane)}if(scene.index!==1)layerGrid.classList.add('hidden');fold.onclick=()=>{layerGrid.classList.toggle('hidden');fold.textContent=layerGrid.classList.contains('hidden')?'展开图片':'收起图片'};card.append(layerGrid);host.append(card)}picker.onchange=()=>{const card=document.getElementById(`scene-card-${picker.value}`);if(card){const layers=card.querySelector('.layers');layers.classList.remove('hidden');card.querySelector('.toolbar button').textContent='收起图片';card.scrollIntoView({behavior:'smooth',block:'start'})}};renderedScenes=true}
  function renderTasks(data){const host=$('tasks');host.replaceChildren();if(!data.tasks.length){host.append(node('p','hint','暂无候选图片或重建任务'));return}for(const task of data.tasks){const box=node('article','task'),head=node('div','task-head');head.append(node('strong','',`${task.kind==='rebuild'?'重建输出':labels[task.layer]||task.layer} · 场景 ${task.scene}`),node('span','',(({queued:'排队中',running:'处理中',ready:'待确认',accepted:'已替换',discarded:'已舍弃',failed:'失败',completed:'已完成'})[task.status]||task.status)+(Number.isFinite(task.progress)?` ${task.progress}%`:'')));box.append(head);if(task.error)box.append(node('p','hint',task.error));if(task.kind==='rebuild'&&task.status==='failed'){const retry=node('button','ghost','重试重建');retry.onclick=async()=>{retry.disabled=true;try{await request('POST',`${apiBase}/rebuild`,{});notice('已重新加入重建队列');await refresh(false)}catch(e){notice(e.message,true);retry.disabled=false}};box.append(retry)}if(task.status==='ready'){const scene=data.scenes.find(item=>item.index===task.scene),original=scene?.layers.find(item=>item.name===task.layer),compare=node('div','compare');for(const [label,url] of [['当前图片',original?.url],['新候选图',task.url]]){const figure=node('figure'),caption=node('figcaption','',label);figure.append(caption);if(url){const image=node('img');image.src=`${url}?t=${Date.now()}`;figure.append(image)}else figure.append(node('div','empty-image','暂无图片'));compare.append(figure)}box.append(compare);const actions=node('div','task-actions'),accept=node('button','primary','采用新图'),discard=node('button','danger','舍弃候选');accept.onclick=async()=>{accept.disabled=true;try{await request('POST',`${apiBase}/candidates/${task.id}/accept`,{});notice('新图已采用；正在后台重建输出');await refresh(true)}catch(e){notice(e.message,true);accept.disabled=false}};discard.onclick=async()=>{try{await request('POST',`${apiBase}/candidates/${task.id}/discard`,{});notice('已保留原图');await refresh(false)}catch(e){notice(e.message,true)}};actions.append(accept,discard);box.append(actions)}host.append(box)}}
  function renderSync(data){const box=$('sync');box.replaceChildren();box.classList.toggle('hidden',!data.needs_sync);if(data.needs_sync){box.append(node('span','',`本地草稿已修改；剪映中的已注册副本仍是旧版。同步将创建带编号的新草稿。 `));const latestRebuild=data.tasks.find(task=>task.kind==='rebuild');const button=node('button','primary',latestRebuild?.status==='completed'?'同步到剪映':'等待重建完成');button.disabled=latestRebuild?.status!=='completed';button.onclick=async()=>{button.disabled=true;try{const result=await request('POST',`${apiBase}/sync-jianying`,{});notice(`已注册新草稿：${result.registered_draft}`);await refresh(false)}catch(e){notice(e.message,true);button.disabled=false}};box.append(button)}}
  async function refresh(full=false){try{const data=(full||!renderedScenes)?await api(apiBase):{...inventory,...await api(`${apiBase}/tasks`)};inventory=data;if(full||!renderedScenes)renderScenes(data);renderTasks(data);renderSync(data)}catch(e){notice(e.message,true)}}
  $('refresh').onclick=()=>refresh(true);refresh(true);setInterval(()=>refresh(false),2500);
</script>
</body>
</html>
