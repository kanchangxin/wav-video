<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色基准图 · 声音成片工作台</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#e9edfa;background:#101321}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#2b3153 0,transparent 36%),#101321;min-height:100vh}button,input,select,textarea{font:inherit}a{color:#b7c9ff}.shell{max-width:1250px;margin:auto;padding:32px 28px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.top h1{font-size:36px;margin:8px 0}.top p{color:#a8b4d0;line-height:1.6}.eyebrow{font-size:12px;letter-spacing:.18em;color:#98a8dc;font-weight:750}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.panel{border:1px solid #303850;background:#1a1f30;border-radius:18px;overflow:hidden}.head{border-bottom:1px solid #303850;padding:20px 22px;font-weight:750}.body{padding:20px 22px}label{display:block;color:#b7c4dc;font-size:12px;font-weight:650;margin:13px 0 7px}input,select,textarea{width:100%;background:#121728;border:1px solid #38415c;border-radius:10px;color:#edf2ff;padding:10px 12px;outline:none}textarea{min-height:115px;line-height:1.5;resize:vertical}.small{color:#8999b9;font-size:12px;line-height:1.5}.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1}.button{border:1px solid #536286;background:#2a3654;color:#eef2ff;border-radius:9px;padding:9px 13px;cursor:pointer}.button:hover{background:#35466e}.button:disabled{opacity:.5;cursor:wait}.primary{background:#a9b9ff;color:#12172b;border:0;font-weight:750}.error{border:1px solid #af5b69;background:#492832;color:#ffd9df;border-radius:9px;padding:10px 12px;font-size:12px;margin:12px 0;display:none}.error.show{display:block}.success{color:#8be4bd}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.view{border:1px solid #39445e;background:#141a2a;border-radius:13px;padding:14px;min-width:0}.view h3{margin:0 0 6px;font-size:15px}.view p{margin:0 0 10px}.view img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#0a0d16;border:1px solid #303850;border-radius:8px;margin:9px 0}.view .placeholder{width:100%;aspect-ratio:3/4;display:grid;place-items:center;background:#101522;border:1px dashed #414e6b;border-radius:8px;margin:9px 0;color:#667493;font-size:12px}.view textarea{min-height:160px;font-size:12px}.view .row{flex-wrap:wrap}.view input[type=file]{font-size:11px;padding:7px}.progress{width:100%;accent-color:#9fb3ff}.muted{color:#7788a9}@media(max-width:1050px){.grid{grid-template-columns:1fr}}@media(max-width:690px){.shell{padding:20px 14px}.top{display:block}.views{grid-template-columns:1fr}.top h1{font-size:28px}}
    .error.show{position:fixed;top:16px;right:16px;z-index:20;max-width:min(480px,calc(100vw - 32px));box-shadow:0 12px 32px #0008}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><div class="eyebrow">CHARACTER REFERENCE</div><h1>角色基准图</h1><p>先确认正面照，再以它为参考生成侧脸和全身照。每张图都可单独重做或导入。</p></div><a href="/">← 返回声音成片工作台</a></header>
  <div id="error" class="error" role="alert"></div>
  <div class="grid">
    <section class="panel"><div class="head">角色档案</div><div class="body">
      <label for="profiles">选择已有档案</label><div class="row"><select id="profiles"><option value="">尚无角色档案</option></select><button id="refresh" class="button" type="button">刷新</button></div>
      <p id="profile-path" class="small"></p><div class="row"><button id="open-folder" class="button" type="button" disabled>打开档案目录</button><button id="delete-profile" class="button" type="button" disabled>删除档案</button></div><p id="profile-feedback" class="small" role="status"></p>
      <hr style="border:0;border-top:1px solid #303850;margin:25px 0"><strong>新建角色档案</strong>
      <label for="name">角色名称</label><input id="name" value="主角" maxlength="80">
      <label for="path">存储路径（项目 characters 目录内）</label><input id="path" value="characters/主角"><p class="small">可修改目录名，创建后可在 Finder 中打开。角色基准图会保存在该目录。</p>
      <label for="model">本机已下载模型</label><select id="model"><option value="">正在读取…</option></select>
      <label for="seed">基准图 seed</label><input id="seed" type="number" min="0" max="4294967295" value="271829">
      <label for="front-prompt">正面半身标准照提示词案例（可修改）</label><textarea id="front-prompt">{{ front_prompt }}</textarea>
      <p class="small">建议写清年龄、脸型、发型、服饰及独特标记。确认正面照后才能生成另外两个视角。</p>
      <button id="create" class="button primary" type="button">创建档案</button><p id="create-feedback" class="small" role="status"></p>
    </div></section>
    <section class="panel"><div class="head">基准图生成与确认 <span id="active-name" class="muted"></span></div><div class="body">
      <div id="generation-status" class="small">选择或创建一个角色档案。</div><div class="row"><div><label for="active-model">当前档案的基准图模型</label><select id="active-model" disabled><option value="">请先选择档案</option></select></div><button id="save-model" class="button" type="button" disabled>保存模型</button></div><p id="model-feedback" class="small" role="status">此模型只用于生成角色基准图；主页面的场景生图模型可单独选择。</p><progress id="generation-progress" class="progress" max="100" value="0" style="display:none"></progress>
      <div id="views" class="views"></div>
    </div></section>
  </div>
</main><script>
const $=id=>document.getElementById(id);let selected='',profile=null,pathTouched=false,lastGeneration='',revision=0;
const labels={front:'正面半身标准照',three_quarter:'3/4 侧脸标准照',full_body:'全身标准照'};
async function api(url,options={}){const r=await fetch(url,options);if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error(`服务器返回了非 JSON 响应（HTTP ${r.status}）`);const data=await r.json();if(!r.ok)throw Error(data.error||`请求失败 ${r.status}`);return data}
function error(message){$('error').textContent=message||'';$('error').classList.toggle('show',!!message)}
function json(data){return {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}}
async function loadModels(){try{const data=await api('/api/drawthings/models');const select=$('model'),active=$('active-model'),previous=select.value,activePrevious=active.value;select.replaceChildren();active.replaceChildren();for(const model of data.models){const label=`${model.name} · ${model.id}`;select.add(new Option(label,model.id));active.add(new Option(label,model.id))}const preferred=[...select.options].find(o=>o.value.startsWith('flux_2_klein'));if([...select.options].some(o=>o.value===previous))select.value=previous;else if(preferred)select.value=preferred.value;if(!data.models.length){select.add(new Option('没有已下载模型',''));active.add(new Option('没有已下载模型',''))}if(profile&&[...active.options].some(o=>o.value===profile.model))active.value=profile.model;else if([...active.options].some(o=>o.value===activePrevious))active.value=activePrevious;render()}catch(e){error(e.message)}}
async function loadProfiles(preferred=''){const data=await api('/api/characters');const select=$('profiles');const old=preferred||selected;select.replaceChildren(new Option('选择角色档案',''));for(const item of data.characters)select.add(new Option(`${item.name} · ${item.id}`,item.id));if([...select.options].some(o=>o.value===old))select.value=old;selected=select.value;await loadProfile()}
function suggested(view){return profile?.suggested_prompts?.[view]||''}
function render(){const views=$('views');$('active-name').textContent=profile?`· ${profile.name}`:'';$('profile-path').textContent=profile?`存储路径：${profile.path}`:'';$('open-folder').disabled=!profile;const running=profile?.generation&&['queued','running'].includes(profile.generation.status);$('delete-profile').disabled=!profile||running;$('active-model').disabled=!profile||running;$('save-model').disabled=!profile||running||!$('active-model').value||$('active-model').value===profile.model;const g=profile?.generation;$('generation-status').textContent=!profile?'选择或创建一个角色档案。':running?`正在生成${labels[g.view]}：${g.percent||0}%`:g?.status==='failed'?`生成失败：${g.error}`:g?.status==='completed'?`${labels[g.view]}预览已生成，请检查并确认。`:'可先生成正面半身标准照。';$('generation-progress').style.display=running?'block':'none';$('generation-progress').value=g?.percent||0;if(!profile){views.replaceChildren();return}
for(const view of Object.keys(labels)){let box=document.getElementById(`view-${view}`);if(!box){box=document.createElement('div');box.className='view';box.id=`view-${view}`;box.innerHTML=`<h3></h3><p class="small state"></p><div class="picture"></div><label>提示词（可修改）</label><textarea></textarea><div class="row"><button class="button generate" type="button">生成预览</button><button class="button primary approve" type="button">确认使用</button></div><label>或导入已有图片</label><input class="import" type="file" accept="image/png,image/jpeg,image/webp">`;views.append(box);box.querySelector('.generate').onclick=()=>generate(view);box.querySelector('.approve').onclick=()=>approve(view);box.querySelector('.import').onchange=e=>importImage(view,e.target.files[0]);}
box.querySelector('h3').textContent=labels[view];const state=profile.views[view].status;box.querySelector('.state').textContent=({empty:'尚未生成',draft:'预览待确认',approved:'已确认，可用于场景',stale:'正面照已更改，请重做此视角'})[state]||state;const textarea=box.querySelector('textarea');if(!textarea.dataset.profile||textarea.dataset.profile!==profile.id){textarea.value=profile.views[view].prompt||suggested(view);textarea.dataset.profile=profile.id}const imageKind=state==='draft'?'draft':state==='approved'?'approved':state==='stale'?(profile.views[view].stale_kind||'approved'):'';const picture=box.querySelector('.picture');if(imageKind){let img=picture.querySelector('img');if(!img){picture.replaceChildren();img=document.createElement('img');img.alt=labels[view];picture.append(img)}const src=`/api/characters/${encodeURIComponent(profile.id)}/image/${view}/${imageKind}?v=${revision}`;if(img.dataset.src!==src){img.src=src;img.dataset.src=src}}else if(!picture.querySelector('.placeholder')){picture.replaceChildren();const blank=document.createElement('div');blank.className='placeholder';blank.textContent='等待图片';picture.append(blank)}box.querySelector('.generate').disabled=running||(view!=='front'&&profile.views.front.status!=='approved');box.querySelector('.approve').disabled=running||state!=='draft';box.querySelector('.import').disabled=running||(view!=='front'&&profile.views.front.status!=='approved')}
}
async function loadProfile(){if(!selected){profile=null;render();return}const requested=selected;try{const previous=profile?.id,previousModel=profile?.model;const loaded=await api(`/api/characters/${encodeURIComponent(requested)}`);if(selected!==requested)return;profile=loaded;const g=JSON.stringify(profile.generation);if(g!==lastGeneration&&profile.generation?.status==='completed')revision++;lastGeneration=g;if(previous!==profile.id){revision++;for(const box of document.querySelectorAll('.view textarea'))box.dataset.profile=''}if(previous!==profile.id||previousModel!==profile.model)$('active-model').value=profile.model;render()}catch(e){if(selected===requested)error(e.message)}}
async function generate(view){error('');try{const prompt=document.querySelector(`#view-${view} textarea`).value.trim();await api(`/api/characters/${encodeURIComponent(selected)}/generate`,json({view,prompt}));await loadProfile()}catch(e){error(e.message)}}
async function approve(view){error('');try{profile=await api(`/api/characters/${encodeURIComponent(selected)}/approve`,json({view}));revision++;render()}catch(e){error(e.message)}}
async function importImage(view,file){if(!file)return;error('');try{const form=new FormData();form.append('view',view);form.append('file',file);profile=await api(`/api/characters/${encodeURIComponent(selected)}/import`,{method:'POST',body:form});revision++;render()}catch(e){error(e.message)}}
$('name').addEventListener('input',()=>{if(!pathTouched)$('path').value=`characters/${$('name').value.trim()}`});$('path').addEventListener('input',()=>pathTouched=true);
$('create').onclick=async()=>{error('');$('create-feedback').textContent='';try{const created=await api('/api/characters',json({name:$('name').value,path:$('path').value,model:$('model').value,seed:Number($('seed').value),front_prompt:$('front-prompt').value}));await loadProfiles(created.id);$('create-feedback').textContent=`已创建「${created.name}」，请在右侧生成基准图。`;$('create-feedback').classList.add('success')}catch(e){$('create-feedback').textContent=e.message;$('create-feedback').classList.remove('success')}};
$('refresh').onclick=()=>loadProfiles().catch(e=>error(e.message));$('profiles').onchange=()=>{selected=$('profiles').value;$('profile-feedback').textContent='';$('model-feedback').textContent='此模型只用于生成角色基准图；主页面的场景生图模型可单独选择。';$('model-feedback').classList.remove('success');loadProfile()};$('open-folder').onclick=async()=>{try{await api(`/api/characters/${encodeURIComponent(selected)}/open`,json({}))}catch(e){error(e.message)}};
$('active-model').onchange=render;$('save-model').onclick=async()=>{try{profile=await api(`/api/characters/${encodeURIComponent(selected)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('active-model').value})});$('model-feedback').textContent=`已保存基准图模型：${profile.model}`;$('model-feedback').classList.add('success');render()}catch(e){$('model-feedback').textContent=e.message;$('model-feedback').classList.remove('success')}};
$('delete-profile').onclick=async()=>{if(!profile||!confirm(`删除「${profile.name}」档案？基准图会移到项目 characters/.deleted 目录，可手动恢复。`))return;try{const name=profile.name;await api(`/api/characters/${encodeURIComponent(selected)}`,{method:'DELETE'});selected='';profile=null;await loadProfiles();$('create-feedback').textContent='';$('model-feedback').textContent='此模型只用于生成角色基准图；主页面的场景生图模型可单独选择。';$('model-feedback').classList.remove('success');$('profile-feedback').textContent=`已删除「${name}」，图片已移到 characters/.deleted。`;$('profile-feedback').classList.add('success')}catch(e){$('profile-feedback').textContent=e.message;$('profile-feedback').classList.remove('success')}};
loadModels();loadProfiles().catch(e=>error(e.message));setInterval(()=>{if(selected)loadProfile()},1200);
</script></body></html>
